<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sila PoC</title>
  <style>
    /* Colours are defined once here; dark mode only swaps these values. */
    :root {
      --bg: #f4f6f5;
      --surface: #ffffff;
      --border: #d5dbd8;
      --text: #1c2321;
      --muted: #56605b;
      --accent: #0f6b5c;
      --on-accent: #ffffff;
      --info-bg: #e8eef3;   --info-text: #2b4256;
      --ok-bg: #e6f4ea;     --ok-text: #14632b;
      --error-bg: #fdecea;  --error-text: #8a1c12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111614;
        --surface: #1a211f;
        --border: #2f3a36;
        --text: #e6ebe8;
        --muted: #a2aca7;
        --accent: #4fbfa8;
        --on-accent: #0b1311;
        --info-bg: #1d2a35;   --info-text: #b8cde0;
        --ok-bg: #16301f;     --ok-text: #8fdca6;
        --error-bg: #3a1714;  --error-text: #ffb4ab;
      }
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 38rem; margin: 0 auto; }

    header { margin-bottom: 1.5rem; }
    h1 { margin: 0; font-size: 2rem; color: var(--accent); }
    h1 span { font-weight: 400; margin-inline-start: 0.4rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); }
    h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 7rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      resize: vertical;
    }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; }
    #counter { color: var(--muted); font-size: 0.9rem; }
    #counter.over { color: var(--error-text); font-weight: 600; }

    button {
      padding: 0.55rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }

    /* A clear outline shows which control the keyboard is on. */
    textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    #status { margin: 1rem 0 0; padding: 0.6rem 0.8rem; border-radius: 8px; }
    #status:empty { display: none; }
    #status[data-kind="info"]  { background: var(--info-bg);  color: var(--info-text); }
    #status[data-kind="ok"]    { background: var(--ok-bg);    color: var(--ok-text); }
    #status[data-kind="error"] { background: var(--error-bg); color: var(--error-text); }

    #feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
    .post-id { display: block; color: var(--muted); font-size: 0.8rem; margin-bottom: 0.25rem; }
    .post-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; border-style: dashed; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Sila<span lang="ar">صِلة</span></h1>
      <p>Assignment 1 proof of concept — fictional demo posts</p>
    </header>

    <section class="card">
      <label for="text">New post</label>
      <textarea id="text" placeholder="Share something with campus…"></textarea>
      <div class="row">
        <span id="counter">0 / 2000</span>
        <button id="publish">Publish</button>
      </div>
      <p id="status" role="status"></p>
    </section>

    <h2>Posts</h2>
    <ul id="feed"></ul>
  </main>

  <script>
    const textbox = document.getElementById("text");
    const counter = document.getElementById("counter");
    const button = document.getElementById("publish");
    const statusLine = document.getElementById("status");
    const feed = document.getElementById("feed");

    // kind is "info", "ok" or "error"; the CSS picks the colours.
    function setStatus(message, kind) {
      statusLine.textContent = message;
      statusLine.dataset.kind = kind;
    }

    // Array.from splits by Unicode code point, like Python's len().
    // (text.length would count an emoji as 2.)
    function updateCounter() {
      const count = Array.from(textbox.value.trim()).length;
      counter.textContent = count + " / 2000";
      counter.classList.toggle("over", count > 2000); // warning only; the backend decides
    }

    // Throws if the request fails, so callers can show the right message.
    async function loadPosts() {
      const response = await fetch("/posts");
      if (!response.ok) throw new Error("Feed request failed");
      const posts = await response.json();
      feed.replaceChildren();
      if (posts.length === 0) {
        const empty = document.createElement("li");
        empty.className = "card empty";
        empty.textContent = "No posts yet.";
        feed.append(empty);
      }
      for (const post of posts) {
        const item = document.createElement("li");
        item.className = "card";
        const id = document.createElement("span");
        id.className = "post-id";
        id.textContent = "#" + post.post_id;
        const body = document.createElement("div");
        body.className = "post-body";
        body.textContent = post.body; // textContent shows HTML as plain text
        item.append(id, body);
        feed.append(item);
      }
    }

    async function publish() {
      button.disabled = true;
      setStatus("Publishing…", "info");
      try {
        let response, data;
        try {
          response = await fetch("/posts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ body: textbox.value }), // the backend trims
          });
          data = await response.json();
        } catch {
          setStatus("The request could not be confirmed. Check that the server is running, then refresh to see whether the post was created.", "error");
          return;
        }
        if (!response.ok) {
          setStatus(data.detail, "error"); // keep the input so it can be fixed
          return;
        }
        textbox.value = "";
        updateCounter();
        try {
          await loadPosts();
          setStatus("Post published.", "ok");
        } catch {
          setStatus("Your post was created, but the feed could not be refreshed. Reload the page to see it.", "error");
        }
      } finally {
        button.disabled = false;
      }
    }

    textbox.addEventListener("input", updateCounter);
    button.addEventListener("click", publish);

    setStatus("Loading posts…", "info");
    loadPosts()
      .then(() => setStatus("", "info"))
      .catch(() => setStatus("Could not load posts.", "error"));
  </script>
</body>
</html>
